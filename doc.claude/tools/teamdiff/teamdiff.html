function fieldLabel(row) {
  const k = row.k.replace(/^ROOT\./, "");
  if (k === "Categories.#") return "Kategorien";
  if (k === "Display.Abilities.#") return "F&auml;higkeiten (Infotext)";
  let m;
  if ((m = k.match(/^Weapon\.\[(\d+)\]\.#vorhanden$/))) return "Waffe " + m[1] + nm(row.label);
  if ((m = k.match(/^Weapon\.\[(\d+)\]\.#buff\.(\d+)$/))) return "Waffe " + m[1] + nm(row.label) + ": Buff " + (row.buff || "");
  if ((m = k.match(/^Weapon\.\[(\d+)\]\.(.+)$/))) return "<span class=grp>Waffe " + m[1] + nm(row.label) + ":</span> " + path(m[2]);
  if ((m = k.match(/^General\.CommandCaps\.RULEUCC_(\w+)$/))) return "<span class=grp>Befehl:</span> " + (CMD[m[1]] || m[1]);
  if ((m = k.match(/^General\.ToggleCaps\.RULEUTC_(\w+)$/))) return "<span class=grp>Schalter:</span> " + (CMD[m[1]] || m[1]);
  if ((m = k.match(/^Enhancements\.(\w+)\.(.+)$/))) return "<span class=grp>Ausbau &bdquo;" + m[1] + "&ldquo;:</span> " + path(m[2]);
  if (k === "Enhancements.Sequence") return "Ausbauten (Reihenfolge)";
  const parts = k.split(".");
  const leaf = parts.pop();
  const grp = parts.filter(p => p !== "#").map(p => SEG[p] || p.replace(/^\[(\d+)\]$/, "$1")).join(" &rsaquo; ");
  return (grp ? "<span class=grp>" + grp + ":</span> " : "") + (LEAF[leaf] || leaf);
}
function path(s) { return s.split(".").map(p => LEAF[p] || SEG[p] || p.replace(/^\[(\d+)\]$/, "$1")).join(" &rsaquo; "); }
function nm(l) { return l ? " (" + clean(l) + ")" : ""; }
function clean(v) { return String(v).replace(/<LOC[^>]*>/g, "").replace(/^['"]|['"]$/g, "").trim(); }
function esc(s) { return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }

function norm(v) {
  if (v === null || v === undefined) return null;
  let s = String(v).replace(/['"]/g, "").replace(/\s+/g, " ").replace(/\/mods\/[^\/]+\//gi, "/mods/~/").replace(/ \(Hook[^)]*\)$/, "");
  if (s.includes("|")) s = s.split("|").sort().join("|");
  return s.trim().toLowerCase();
}
function fmt(v) {
  if (v === null || v === undefined) return "&mdash;";
  if (v === "(fehlt)") return "&mdash;";
  if (v === "(entfernt)") return "entfernt";
  let s = String(v);
  let hook = "";
  const hm = s.match(/ (\(Hook[^)]*\))$/); if (hm) { hook = " <i>" + hm[1] + "</i>"; s = s.slice(0, -hm[0].length); }
  if (s === "true") return "ja" + hook;
  if (s === "false") return "nein" + hook;
  const t = s.match(/^\{(.*)\}$/);
  if (t) { const inner = t[1].trim(); if (!inner) return "(leer)" + hook; if (!inner.includes("=")) return esc(inner.split(",").map(x => clean(x.trim())).join(", ")) + hook; }
  s = clean(s);
  s = s.replace(/^\/mods\/[^\/]+\/projectiles\/([^\/]+)\/.*$/i, "$1").replace(/^\/projectiles\/([^\/]+)\/.*$/i, "$1");
  if (/^-?\d+\.\d+$/.test(s)) s = s.replace(".", ",");
  return esc(s) + hook;
}
function listCell(v, base) {
  if (v === null || v === undefined) return "&mdash;";
  if (v === "(entfernt)") return "entfernt";
  if (v === "(fehlt)") return "&mdash;";
  const cur = v.split("|").map(clean);
  if (base === null || base === undefined || base === "(fehlt)") return esc(cur.join(", "));
  const b = base.split("|").map(clean);
  const add = cur.filter(x => !b.includes(x)), rem = b.filter(x => !cur.includes(x));
  if (!add.length && !rem.length) return "wie Original";
  return [...add.map(x => "+ " + esc(x)), ...rem.map(x => "&minus; " + esc(x))].join("<br>");
}

const SECT = ["Economy","Defense","Physics","Air","Intel","Transport","General","AI","Weapon","Enhancements","Categories","Display"];
function sectIdx(k) { const s = k.replace(/^ROOT\./, "").split(".")[0]; const i = SECT.indexOf(s); return i < 0 ? 50 : i; }
function wIdx(k) { const m = k.match(/Weapon\.\[(\d+)\]/); return m ? +m[1] : 0; }

function collapseBuffs(rows) {
  const out = [], groups = {};
  for (const r of rows) {
    const m = r.k.match(/^(ROOT\.Weapon\.\[(\d+)\])\.Buffs\.\[(\d+)\]\.(.+)$/);
    if (!m) { out.push(r); continue; }
    const g = m[1] + "#" + m[3];
    if (!groups[g]) { groups[g] = { k: m[1] + ".#buff." + m[3], label: r.label, rows: [] }; out.push(groups[g]); }
    groups[g].rows.push(r);
  }
  return out.map(x => {
    if (!x.rows) return x;
    const col = c => { const vs = x.rows.map(r => r[c]); if (vs.every(v => v === null || v === undefined)) return null;
      if (vs.every(v => v === "(entfernt)")) return "(entfernt)"; if (vs.every(v => v === "(fehlt)")) return "(fehlt)"; return "vorhanden"; };
    const bt = x.rows.find(r => /BuffType$/.test(r.k));
    const t = bt ? clean(bt.o && bt.o[0] !== "(" ? bt.o : (bt.c && bt.c[0] !== "(" ? bt.c : bt.n)) : "";
    return { k: x.k, label: x.label, buff: t === "FUELRATIO" ? "Treibstoff-Entzug (FUELRATIO)" : t, o: col("o"), c: col("c"), n: col("n") };
  });
}

function faction(id) {
  if (id === "MKT0409") return "UEF";
  const c = id[1]; return { A:"Aeon", E:"UEF", R:"Cybran", S:"Seraphim", L:"Seraphim" }[c] || "&ndash;";
}
function srcName(s) {
  if (!s) return "neu (gibt es in LOUD nicht)";
  if (/^units\\units/i.test(s)) return "LOUD-Basisspiel";
  if (/^blackops/i.test(s)) return "BlackOps";
  if (/^brewlan/i.test(s)) return "BrewLAN";
  if (/^4D/i.test(s)) return "4th Dimension (4DC)";
  if (/^WyvernBattlePack/i.test(s)) return "Wyvern BattlePack";
  if (/^loud_units/i.test(s)) return "LOUD Unit Additions";
  return esc(s.split("\\")[0]);
}

function unitHtml(u) {
  const rows = collapseBuffs(u.rows || []).sort((a, b) => sectIdx(a.k) - sectIdx(b.k) || wIdx(a.k) - wIdx(b.k));
  const seen = new Set();
  const noOrig = !u.src;
  let body = "";
  for (const r of rows) {
    if (seen.has(r.k)) continue; seen.add(r.k);
    const isList = /\.#$/.test(r.k);
    const no = norm(r.o), nc = norm(r.c), nn = norm(r.n);
    if (!noOrig && no === nc && nc === nn) continue;
    const colinChanged = !noOrig && nc !== no;
    const oursDiff = nn !== nc;
    const oc = isList ? (noOrig || !r.o || r.o[0] === "(" ? "&mdash;" : r.o.split("|").length + " Eintr&auml;ge") : (noOrig ? "&mdash;" : fmt(r.o));
    const cc = isList ? listCell(r.c, r.o) : fmt(r.c);
    const ncell = isList ? listCell(r.n, r.o) : fmt(r.n);
    body += "<tr" + (oursDiff ? " class=star" : "") + "><td class=field>" + fieldLabel(r) + "</td>"
      + "<td" + (noOrig || r.o === null || r.o === "(fehlt)" ? " class=none" : "") + ">" + oc + "</td>"
      + "<td class=\"" + (colinChanged ? "chg" : "") + "\">" + cc + "</td>"
      + "<td class=\"" + (oursDiff ? "ours" : "") + "\">" + ncell + "</td></tr>";
  }
  const nrows = (body.match(/<tr/g) || []).length;
  const head = "<div class=uhead><h3>" + esc(u.name || u.desc || u.id) + "</h3><span class=desc>" + (u.name ? esc(u.desc || "") : "") + "</span><span class=id>" + u.id + "</span></div>"
    + "<div class=tags><span class=tag>" + faction(u.id) + "</span><span class=tag>Herkunft: " + srcName(u.src) + "</span><span class=\"tag" + (u.kind === "Merge" ? " merge" : "") + "\">"
    + (u.kind === "Merge" ? "Merge &ndash; nur ge&auml;nderte Felder" : "Kopie im Mod") + "</span></div>";
  let tbl = body
    ? "<table><colgroup><col class=f><col class=v><col class=v><col class=v></colgroup><thead><tr><th>Feld</th><th>Original</th><th>Colin</th><th>Aktuell</th></tr></thead><tbody>" + body + "</tbody></table>"
    : "<div class=same>Werte unver&auml;ndert gegen&uuml;ber dem Original.</div>";
  if (u.hidden) tbl += "<div class=hidden>Dazu " + u.hidden + " technische Felder (Grafik, Ton, Modell) &ndash; nicht aufgef&uuml;hrt.</div>";
  return "<div class=\"unit" + (nrows > 22 ? " long" : "") + "\">" + head + tbl + "</div>";
}

function render() {
  const byMod = {}; for (const m of DATA) byMod[m.mod] = m.units;
  let h = "";
  h += "<div class=cover><div><div class=kicker>LOUD &middot; Supreme Commander Forged Alliance</div>"
    + "<h1>Unsere Mods &ndash;<br>was sich ge&auml;ndert hat</h1>"
    + "<div class=sub>Einheit f&uuml;r Einheit: wie LOUD sie liefert, was Colin in <i>UEF_trans_men</i> daraus gemacht hat und was jetzt mit unseren Mods im Spiel ist.</div>"
    + "<div class=cols3><div class=colcard><b>Original</b>Die Fassung in LOUD &ndash; Basisspiel oder ein LOUD-Paket wie BlackOps, BrewLAN, 4th Dimension, Wyvern BattlePack.</div>"
    + "<div class=\"colcard c\"><b>Colin</b>Colins Sammelmod <i>UEF_trans_men</i>. Gelb hinterlegt: Colin hat gegen&uuml;ber LOUD ge&auml;ndert.</div>"
    + "<div class=\"colcard n\"><b>Aktuell</b>Was mit unserem Mod im Spiel ankommt. Gr&uuml;n und &#9733;: wir weichen bewusst von Colin ab.</div></div></div>"
    + "<div class=meta>Stand " + STAND + " &middot; erzeugt aus den Blueprints, nicht von Hand &middot; reine Pfadumschreibungen und Grafik-/Tondaten sind ausgeblendet</div></div>";

  h += "<section class=page><h2>&Uuml;berblick</h2><div class=h2sub>" + ORDER.length + " Mods mit Bezug zu Colins Sammelmod, dazu Basegame Bugfixes</div>"
    + "<table class=over><colgroup><col style=\"width:27%\"><col style=\"width:45%\"><col style=\"width:9%\"><col style=\"width:19%\"></colgroup><thead><tr><th>Mod</th><th>Worum es geht</th><th>Einheiten</th><th>Stand</th></tr></thead><tbody>";
  for (const k of ORDER) { const m = MODS[k]; h += "<tr><td>" + m.title + "</td><td>" + m.zweck + "</td><td>" + (byMod[k] || []).length + "</td><td>" + m.status + "</td></tr>"; }
  h += "<tr><td>Basegame Bugfixes</td><td>Behebt Fehler in LOUD selbst, unabh&auml;ngig von Colin.</td><td>&ndash;</td><td>Fix im Spiel best&auml;tigt</td></tr>";
  h += "</tbody></table>"
    + "<div class=legend style=\"margin-top:6mm\"><span><span class=sw style=\"background:var(--colin)\"></span>Colin &ne; Original</span><span><span class=sw style=\"background:var(--ours)\"></span>&#9733; Aktuell &ne; Colin (unsere Entscheidung)</span><span>&mdash; = gibt es dort nicht</span></div>"
    + "<p class=intro>Alle Werte stammen direkt aus den Blueprint-Dateien. Bei Merge-Einheiten ist &bdquo;Aktuell&ldquo; das LOUD-Original mit unseren Feldern dar&uuml;ber &ndash; so, wie das Spiel es zusammensetzt. &Auml;nderungen in Scripts und Regeln stehen jeweils im grauen Kasten am Anfang eines Mods.</p></section>";

  for (const k of ORDER) {
    const m = MODS[k], units = byMod[k] || [];
    h += "<section class=page><h2>" + m.title + "</h2><div class=h2sub>" + units.length + " Einheiten &middot; " + m.status + "</div>"
      + "<p class=intro>" + m.zweck + "</p>"
      + "<div class=notes><h4>Au&szlig;erhalb der Werte</h4><ul>" + m.notes.map(n => "<li>" + n + "</li>").join("") + "</ul></div>";
    for (const u of units) h += unitHtml(u);
    h += "</section>";
  }

  h += "<section class=page><h2>Basegame Bugfixes</h2><div class=h2sub>keine Einheiten &middot; Fix im Spiel best&auml;tigt</div>"
    + "<p class=intro>Behebt Fehler in LOUD selbst. Jeder davon sollte auch an das LOUD-Projekt gemeldet werden.</p>"
    + "<div class=notes><h4>Enthalten</h4><ul><li><b>Fatboy unsichtbar</b> bei sehr schnellem Bau: der Baukubus wurde abgebrochen, bevor er die Einheit einblendet. Jetzt blendet das Bauende sie notfalls ein &ndash; wie es LOUD bei Geb&auml;uden schon tut.</li></ul></div>";
  h += "<h2 style=\"margin-top:10mm\">Noch offen in UEF_trans_men</h2><div class=h2sub>vier Einheiten mit &Auml;nderungen von Colin, in keinem unserer Mods</div>"
    + "<table class=over><colgroup><col style=\"width:16%\"><col style=\"width:12%\"><col style=\"width:22%\"><col style=\"width:50%\"></colgroup><thead><tr><th>Einheit</th><th>Fraktion</th><th>Was</th><th>Colins &Auml;nderungen</th></tr></thead><tbody>"
    + OPEN.map(o => "<tr><td>" + o[0] + " <span style=\"color:var(--muted);font-weight:400\">" + o[1] + "</span></td><td>" + o[2] + "</td><td>" + o[3] + "</td><td>" + o[4] + "</td></tr>").join("")
    + "</tbody></table>"
    + "<p class=intro style=\"margin-top:4mm\">Schon anderswo: die Massenextraktoren in <i>T4 Mass Extractors</i>; Dr. Greg House, Au-iya, Nightshade, Twilight und Whisper in Colins <i>advanced_rebalence</i>. Unver&auml;ndert gegen&uuml;ber LOUD und deshalb ohne Mod: Gewittersturm (Ythotha), Dehgarwof, Torrent. Verworfen: Sky Boxer.</p></section>";
  document.getElementById("root").innerHTML = h;
}
render();
</script>
</body>
</html>
